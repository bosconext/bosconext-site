<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 編集画面は検索エンジンに載せない -->
<meta name="robots" content="noindex, nofollow">
<title>BOSCO NEXT｜サイト編集</title>

<!--
  設定ファイルは 1つ上の階層（bosconext/config.yml）を読み込みます。
  ※ 項目を増やしたいときは config.yml のほうを編集してください。
-->
<link href="../config.yml" type="text/yaml" rel="cms-config-url">

<style>
  body{margin:0;font-family:"Hiragino Sans","Zen Kaku Gothic New",sans-serif;background:#f7f3ec}
  /* CMSが読み込まれるまでの表示 */
  #boot{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;
    background:linear-gradient(160deg,#221d1a,#100d0b);color:#fff;z-index:9999;
  }
  #boot .ball{
    width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff 0 30%,transparent 31%),#d4202a;
    box-shadow:inset 0 0 0 5px #f4c01e;
    animation:spin 1.6s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot h1{font-size:1.1rem;margin:0;letter-spacing:.06em}
  #boot p{margin:0;font-size:.85rem;color:rgba(255,255,255,.7);line-height:1.8;max-width:34em}
  #boot a{color:#f4c01e}
  #boot .slow{display:none}
</style>
</head>
<body>

<!-- CMSが起動すると、このブロックは下のスクリプトで消えます -->
<div id="boot">
  <div class="ball"></div>
  <h1>編集画面を読み込んでいます…</h1>
  <p class="slow">
    読み込みに時間がかかっています。<br>
    通信環境を確認して、ページを再読み込みしてみてください。<br>
    それでも表示されない場合は、リポジトリ内の
    <code>bosconext/編集ガイド.md</code> の「Z. 編集画面のログイン設定」を確認してください。
  </p>
</div>

<script src="https://unpkg.com/decap-cms@^3.16.0/dist/decap-cms.js"></script>
<script>
  // CMSの画面が出たら、読み込み中の表示を消す
  (function () {
    var boot = document.getElementById('boot');
    if (!boot) return;
    var done = false;
    function hide() {
      if (done) return;
      done = true;
      boot.style.display = 'none';
    }
    // Decap CMS の描画先(#nc-root)が現れたら消す
    var timer = setInterval(function () {
      if (document.getElementById('nc-root')) { clearInterval(timer); hide(); }
    }, 200);
    // 5秒たっても出ない場合は、案内文を表示する
    setTimeout(function () {
      var slow = boot.querySelector('.slow');
      if (slow && !done) slow.style.display = 'block';
    }, 5000);
    // 念のため、60秒で強制的に消す
    setTimeout(function(){ clearInterval(timer); hide(); }, 60000);
  })();
</script>
</body>
</html>
